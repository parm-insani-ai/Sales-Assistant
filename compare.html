<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your comparison</title>
<meta name="description" content="A side-by-side, feature-by-feature vehicle comparison.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="entoa">
<meta property="og:title" content="Your vehicle comparison">
<meta property="og:description" content="Side by side, feature by feature — see how they stack up.">
<meta property="og:image" content="https://entoa.ai/icons/compare-banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://entoa.ai/icons/compare-banner.png">
<link rel="icon" href="./icons/icon.svg">
<style>
  :root {
    --brand: #206C48; --brand-ink: #fff; --bg: #f6f7f8; --surface: #fff;
    --text: #16191d; --muted: #6b7580; --border: #e5e8ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --brand: #46B681; --brand-ink: #0b1a13; --bg: #0c0f12; --surface: #14181c; --text: #eef1f3; --muted: #8b949c; --border: #242a30; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100dvh; padding: 20px 14px calc(28px + env(safe-area-inset-bottom)); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.4rem; letter-spacing: -0.03em; margin: 4px 0 4px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }
  /* One grid for the whole table so every row shares one height — labels
     always line up with their values, even when a cell wraps. */
  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 14px; background: var(--surface); }
  .grid { display: grid; width: max-content; min-width: 100%; }
  .cell { padding: 10px; font-size: 0.88rem; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); line-height: 1.35; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .lcell { position: sticky; left: 0; z-index: 1; background: var(--bg); color: var(--muted); font-size: 0.76rem; font-weight: 650; border-left: none; }
  .hcell { font-weight: 700; font-size: 0.92rem; align-items: flex-start; background: var(--surface); }
  .last { border-bottom: none; }
  .best { color: var(--brand); font-weight: 700; }
  .tag { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.04em; background: color-mix(in srgb, var(--brand) 16%, transparent); color: var(--brand); padding: 1px 5px; border-radius: 99px; vertical-align: middle; }
  .cta { display: block; text-align: center; margin-top: 18px; padding: 15px; border-radius: 14px; background: var(--brand); color: var(--brand-ink); font-weight: 700; text-decoration: none; font-size: 1rem; }
  .foot { color: var(--muted); font-size: 0.76rem; text-align: center; margin-top: 16px; line-height: 1.5; }
  .bad { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .note { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; font-size: 0.92rem; line-height: 1.5; margin-bottom: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="bad" class="bad hidden">This comparison link looks incomplete — ask for a fresh one.</div>
  <div id="page" class="hidden">
    <h1 id="head">Your comparison</h1>
    <div class="sub" id="sub"></div>
    <div class="note hidden" id="note"></div>
    <div class="scroll" id="table"></div>
    <a class="cta hidden" id="cta" href="#">📅 Book a time to see it in person</a>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
(function () {
  "use strict";
  function b64urlDecode(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return decodeURIComponent(Array.from(atob(s), function (c) { return "%" + c.charCodeAt(0).toString(16).padStart(2, "0"); }).join(""));
  }
  var esc = function (t) { var d = document.createElement("div"); d.textContent = t == null ? "" : String(t); return d.innerHTML; };
  function bad() { document.getElementById("bad").classList.remove("hidden"); }
  function init(data) {
  if (!data || !data.v || !data.v.length || !data.r) { bad(); return; }

  document.getElementById("page").classList.remove("hidden");
  // Optional personal framing: an invite names the vehicle picked for this
  // customer, where a plain comparison is neutral. Never carries pricing.
  if (data.h) { document.getElementById("head").textContent = data.h; document.title = data.h; }
  if (data.m) {
    var note = document.getElementById("note");
    note.textContent = data.m;
    note.classList.remove("hidden");
  }
  document.getElementById("sub").textContent =
    (data.n ? "Put together for you by " + data.n : "Side by side, feature by feature") + (data.d ? " · " + data.d : "");

  var w = data.w || {};
  var keys = data.k || [];
  var cells = ['<div class="cell lcell hcell"></div>'];
  data.v.forEach(function (v) { cells.push('<div class="cell hcell">' + esc(v.name) + "</div>"); });
  data.r.forEach(function (label, ri) {
    var last = ri === data.r.length - 1 ? " last" : "";
    cells.push('<div class="cell lcell' + last + '">' + esc(label) + "</div>");
    data.v.forEach(function (v, ci) {
      var isBest = keys[ri] != null && w[keys[ri]] === ci;
      cells.push('<div class="cell' + (isBest ? " best" : "") + last + '">' + esc(v.cells[ri]) + (isBest ? ' <span class="tag">best</span>' : "") + "</div>");
    });
  });
  document.getElementById("table").innerHTML =
    '<div class="grid" style="grid-template-columns: 104px repeat(' + data.v.length + ', minmax(150px, 180px))">' + cells.join("") + "</div>";

  if (data.b) {
    var cta = document.getElementById("cta");
    cta.href = data.b;
    cta.classList.remove("hidden");
  }
  document.getElementById("foot").textContent =
    (data.h ? "Specs are approximate (Canadian market) — we'll go through the exact details when you're in."
            : "Specs and pricing are approximate (base trims, Canadian market) — we'll confirm exact details together.") +
    (data.n ? " — " + data.n : "");
  }

  // Two link shapes: short (?l=<code>&s=<host>~<function> — the payload lives
  // in the cloud) and legacy long (?c=<base64 payload> — self-contained).
  var q = new URLSearchParams(location.search);
  var code = q.get("l"), sref = q.get("s") || "";
  if (code) {
    var ti = sref.indexOf("~");
    var host = ti > 0 ? sref.slice(0, ti) : "", fn = ti > 0 ? sref.slice(ti + 1) : "";
    if (!/^[\w.-]+(:\d+)?$/.test(host) || !/^[\w-]+$/.test(fn)) { bad(); return; }
    var scheme = /^(localhost|127\.)/.test(host) ? "http" : "https";
    fetch(scheme + "://" + host + "/functions/v1/" + fn + "?l=" + encodeURIComponent(code))
      .then(function (r) { return r.json(); })
      .then(function (j) { init(j && j.payload); })
      .catch(bad);
  } else {
    var data = null;
    try { data = JSON.parse(b64urlDecode(q.get("c") || "")); } catch (e) {}
    init(data);
  }
})();
</script>
</body>
</html>
