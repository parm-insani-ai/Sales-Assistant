name: Deploy to GitHub Pages

# Publishes the app to GitHub Pages on every push to the default branch.
on:
  push:
    branches: ["claude/car-sales-assistant-ry2igb"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stamp the build so every push ships a genuinely new service worker and
      # the installed PWA auto-updates. The cache name becomes the commit hash,
      # and version.json lets the app show/what's-live and "Check for updates".
      - name: Stamp build version
        run: |
          SHA="${GITHUB_SHA::12}"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s/const CACHE = \"[^\"]*\";/const CACHE = \"entoa-${SHA}\";/" sw.js
          printf '{"version":"%s","built":"%s"}\n' "$SHA" "$BUILT" > version.json
          echo "Stamped sw.js and version.json with $SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the static site (index.html at the root).
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
