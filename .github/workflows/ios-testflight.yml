name: iOS · build and upload to TestFlight

# Builds the iPhone app (the web app wrapped by Capacitor, see
# native/README.md) on a Mac runner and uploads it to TestFlight. Run it by
# hand from the Actions tab; nothing here runs on a push.
#
# Secrets it needs (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID             the 10-character team id (developer.apple.com → Membership)
#   ASC_KEY_ID                App Store Connect API key id
#   ASC_ISSUER_ID             App Store Connect API issuer id
#   ASC_KEY_P8                the API key's .p8 file, base64-encoded (base64 -i AuthKey_XXXX.p8)
#   IOS_DIST_CERT_P12         the Apple Distribution certificate + private key, .p12, base64-encoded
#   IOS_DIST_CERT_PASSWORD    the .p12 password
#
# The provisioning profile is fetched by Xcode itself with the API key
# (-allowProvisioningUpdates), so none is stored here. The build number is
# the run number, so every upload is newer than the last.

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Shell loads the live site (https://entoa.ai) instead of bundling the files. Web deploys then reach the phones without a new build."
        type: boolean
        default: false
      version:
        description: "Marketing version shown in TestFlight (e.g. 1.0)"
        default: "1.0"

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Copy the web app into the shell
        env:
          CAP_SERVER_URL: ${{ inputs.live && 'https://entoa.ai' || '' }}
        run: |
          npm run native:build
          npx cap sync ios

      - name: Signing identity and API key
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # Every secret, present, before anything is tried.
          for v in APPLE_TEAM_ID:"$TEAM_ID" ASC_KEY_ID:"$ASC_KEY_ID" ASC_ISSUER_ID:"$ASC_ISSUER_ID" ASC_KEY_P8:"$ASC_KEY_P8" IOS_DIST_CERT_P12:"$P12_B64" IOS_DIST_CERT_PASSWORD:"$P12_PASSWORD"; do
            if [ -z "${v#*:}" ]; then echo "::error::The repository secret ${v%%:*} is empty or missing (Settings → Secrets and variables → Actions)."; exit 1; fi
          done
          # The two API-key secrets pasted the other way round: use them the right way round.
          if [[ "$ASC_KEY_ID" == *"BEGIN PRIVATE KEY"* ]] && [[ "$ASC_KEY_P8" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::notice::ASC_KEY_ID holds the key file and ASC_KEY_P8 the key id — using them swapped. Swap the two secrets when convenient."
            SWAP="$ASC_KEY_ID"; ASC_KEY_ID="$ASC_KEY_P8"; ASC_KEY_P8="$SWAP"; unset SWAP
            echo "ASC_KEY_ID_FIXED=$ASC_KEY_ID" >> "$GITHUB_ENV"
          fi
          if ! [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then echo "::error::ASC_KEY_ID should be the 10-character key id exactly as App Store Connect shows it (letters and digits, no spaces); it is ${#ASC_KEY_ID} characters."; exit 1; fi
          if ! [[ "$ASC_ISSUER_ID" =~ ^[0-9a-f-]{36}$ ]]; then echo "::error::ASC_ISSUER_ID should be the 36-character issuer id with dashes from App Store Connect → Integrations; it is ${#ASC_ISSUER_ID} characters."; exit 1; fi
          if ! [[ "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then echo "::error::APPLE_TEAM_ID should be the 10-character Team ID from Membership details; it is ${#TEAM_ID} characters."; exit 1; fi
          # The API key: accepted as the file's base64 or as its plain text.
          mkdir -p "$HOME/private_keys"
          KEYFILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          if [[ "$ASC_KEY_P8" == *"BEGIN PRIVATE KEY"* ]]; then printf '%s\n' "$ASC_KEY_P8" > "$KEYFILE";
          else echo "$ASC_KEY_P8" | base64 --decode > "$KEYFILE" 2>/dev/null || true; fi
          if ! grep -q "BEGIN PRIVATE KEY" "$KEYFILE"; then
            # Describe the shape of what arrived, never its content.
            RAW_LEN=${#ASC_KEY_P8}
            DEC_LEN=$(wc -c < "$KEYFILE" | tr -d ' ')
            HEAD4=$(head -c 4 "$KEYFILE" | xxd -p 2>/dev/null || echo "?")
            case "$HEAD4" in
              3082*) WHAT="binary DER/PKCS12 data — this looks like the .p12 certificate, not the .p8 key" ;;
              2d2d2d2d) WHAT="text starting with dashes but without 'BEGIN PRIVATE KEY'" ;;
              "") WHAT="nothing — the value did not decode as base64 and is not key text" ;;
              *) WHAT="unrecognised data (first bytes $HEAD4)" ;;
            esac
            echo "::error::ASC_KEY_P8 doesn't hold a .p8 key. Received $RAW_LEN characters, decoding to $DEC_LEN bytes of $WHAT. It should be the App Store Connect API key file (AuthKey_${ASC_KEY_ID}.p8, from App Store Connect → Users and Access → Integrations): paste the file's text, which starts with -----BEGIN PRIVATE KEY-----."
            exit 1
          fi
          echo "API key file in place ($(wc -c < "$KEYFILE" | tr -d ' ') bytes)."
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # The certificate has to be an Apple Distribution one, or the archive can't be exported for the store.
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::The .p12 in IOS_DIST_CERT_P12 holds no Apple Distribution certificate. Found: $(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n '1,3p' | tr '\n' ' ')"
            exit 1
          fi
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MARKETING_VERSION: ${{ inputs.version }}
        working-directory: ios/App
        run: |
          set -euo pipefail
          ASC_KEY_ID="${ASC_KEY_ID_FIXED:-$ASC_KEY_ID}"
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            archive | tail -40

      - name: Export the .ipa
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ASC_KEY_ID="${ASC_KEY_ID_FIXED:-$ASC_KEY_ID}"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -20
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ASC_KEY_ID="${ASC_KEY_ID_FIXED:-$ASC_KEY_ID}"
          IPA="$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded $(basename "$IPA") as build $GITHUB_RUN_NUMBER. It appears in App Store Connect → TestFlight after processing (usually 10–30 minutes)."

      - name: Keep the .ipa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viniva-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore

      - name: Clean up the keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f "$HOME"/private_keys/AuthKey_*.p8
