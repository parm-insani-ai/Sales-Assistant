name: Deploy the function

# Deploys supabase/functions/voice-agent/index.ts to the Supabase function
# the app calls (quick-api, the last segment of Settings → Voice agent URL)
# on every push that changes it, so nobody pastes it by hand. The calendar
# proxy (ics-proxy) deploys alongside it. Secrets already set on the
# function (ANTHROPIC_API_KEY, VAPID keys, Twilio) are untouched by a
# deploy; Verify JWT stays off, as the README says it must.
#
# One-time setup:
#   1. Supabase → your avatar → Account → Access Tokens → Generate new token.
#   2. GitHub → this repo → Settings → Secrets and variables → Actions →
#      New repository secret, named SUPABASE_ACCESS_TOKEN.
# Optional repository variables (same page, Variables tab):
#   SUPABASE_PROJECT_REF   the project's ref (default bgzkafhlwaldbdfehfsa)
#   SUPABASE_FUNCTION_NAME the function the app calls (default quick-api)

on:
  push:
    branches: ["claude/car-sales-assistant-ry2igb"]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-function.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-function
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'bgzkafhlwaldbdfehfsa' }}
      FN: ${{ vars.SUPABASE_FUNCTION_NAME || 'quick-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add a repository secret named SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens; then GitHub → Settings → Secrets and variables → Actions) and run this again."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The folder is voice-agent for historical reasons; the deployed name
      # is whatever the app's Settings → Voice agent URL ends in. Deploy the
      # same file under that name.
      - name: Deploy the app's function
        run: |
          if [ "$FN" != "voice-agent" ]; then
            rm -rf "supabase/functions/$FN"
            mkdir -p "supabase/functions/$FN"
            cp supabase/functions/voice-agent/index.ts "supabase/functions/$FN/index.ts"
          fi
          supabase functions deploy "$FN" --project-ref "$PROJECT_REF" --no-verify-jwt
          echo "Deployed supabase/functions/voice-agent/index.ts as $FN (${GITHUB_SHA::12})"

      - name: Deploy the calendar proxy
        run: supabase functions deploy ics-proxy --project-ref "$PROJECT_REF" --no-verify-jwt
