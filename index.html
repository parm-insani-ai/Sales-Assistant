<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Zoom is locked so the app behaves like an app: no pinch-zoom, and no
       double-tap zoom lurching the page while you're tapping through a list.
       Deliberately NOT applied to book.html or compare.html — those are the
       pages customers open, and pinching to read them is theirs to do. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1b1d1e" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="entoa" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>entoa</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <button id="quick-add" class="icon-btn" aria-label="Quick add" title="Quick add">+</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Main navigation">
      <a href="#/" class="tab" data-route="/">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.6 12 3l9 7.6"/><path d="M5 9.4V20a1 1 0 0 0 1 1h3.5v-5.5h5V21H18a1 1 0 0 0 1-1V9.4"/></svg></span><span class="tab-label">Home</span>
      </a>
      <a href="#/leads" class="tab" data-route="/leads">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.3"/><path d="M3.4 20a5.6 5.6 0 0 1 11.2 0"/><path d="M16.2 5.3a3.3 3.3 0 0 1 0 5.9"/><path d="M18.4 20a5.6 5.6 0 0 0-3-4.95"/></svg></span><span class="tab-label">Leads</span>
      </a>
      <button id="voice-btn" class="tab tab-voice" aria-label="Voice command">
        <span class="voice-fab"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0"/><path d="M12 18v3"/></svg></span>
        <span class="tab-label">Voice</span>
      </button>
      <a href="#/tools" class="tab" data-route="/tools">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/></svg></span><span class="tab-label">Tools</span>
      </a>
      <a href="#/comms" class="tab" data-route="/comms">
        <span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7 7 0 0 1-9.9 6.4L4.5 19.5l1.2-5.4A7 7 0 1 1 20 11.5z"/><path d="M8.5 10h7M8.5 13h4.5"/></svg></span><span class="tab-label">Comms</span>
      </a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
