<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sales Assistant" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>Sales Assistant</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="page-title">Dashboard</h1>
      <button id="quick-add" class="icon-btn" aria-label="Quick add" title="Quick add">+</button>
    </header>

    <main id="view" class="view"></main>

    <nav class="tabbar" aria-label="Main navigation">
      <a href="#/" class="tab" data-route="/">
        <span class="tab-icon">🏠</span><span class="tab-label">Home</span>
      </a>
      <a href="#/leads" class="tab" data-route="/leads">
        <span class="tab-icon">👥</span><span class="tab-label">Leads</span>
      </a>
      <a href="#/inventory" class="tab" data-route="/inventory">
        <span class="tab-icon">🚗</span><span class="tab-label">Inventory</span>
      </a>
      <a href="#/calculator" class="tab" data-route="/calculator">
        <span class="tab-icon">🧮</span><span class="tab-label">Deal</span>
      </a>
      <a href="#/deliveries" class="tab" data-route="/deliveries">
        <span class="tab-icon">✅</span><span class="tab-label">Delivery</span>
      </a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
